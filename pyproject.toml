[project]
name = "whisper-timestamped-service"
version = "2.1.4-rc6"
description = "Separate HTTP service for Whisper timestamped transcription"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Jörg Leu" },
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.28.0,<1.0.0",
]
local = [
  "numpy>=1.26.0,<3.0.0",
  # Fest: torch 2.14.1 (cuDNN 9.24) laesst large-v3 an kippligen Stellen in
  # Wiederholungsschleifen laufen; 2.12.0 (cuDNN 9.20) rechnet wie bisher.
  "torch==2.12.0",
  "auditok>=0.1.8,<1.0.0",
  "whisper-timestamped>=1.15.6,<2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
